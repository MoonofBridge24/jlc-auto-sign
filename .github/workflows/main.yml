name: auto-signin

on:
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * *'
    - cron: '17 11 * * *'
    #在这里设置UTC运行时间，如果不知道怎么配置可以问AI
    #实际运行时间会比设置时间延迟一小时以内，取决于当时github资源占用情况。

jobs:
  running:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: 3.7

      - name: 'Set Timezone to UTC+8'
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "Current time: $(date)"

      - name: 'Install requirements'
        run: |
          pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: Prepare chromedriver
        uses: nanasess/setup-chromedriver@v2

      # 备用持久化：secret 回写需要 PAT，没配的时候凭证还能靠 Actions 缓存跨次传递
      - name: 'Restore credential cache'
        uses: actions/cache/restore@v4
        with:
          path: credentials.json
          key: jlc-credentials-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jlc-credentials-

      - name: 'Working'
        env:
          # 上次运行留下的凭证（JSON）。为空时本次会走浏览器登录
          JLC_CREDENTIALS: ${{ secrets.JLC_CREDENTIALS }}
          # Server酱3 推送（可选）：不配置该 secret 则跳过推送
          SERVERCHAN3_SCKEY: ${{ secrets.SERVERCHAN3_SCKEY }}
          JLC_CREDENTIAL_FILE: credentials.json
        run: |
          python ./jlc.py ${{ secrets.JLC_USERNAME }} ${{ secrets.JLC_PASSWORD }}

      - name: 'Inspect credential file'
        id: creds
        if: always()
        run: |
          if [ -s credentials.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "凭证文件大小: $(wc -c < credentials.json) 字节"
            python -c "import json;d=json.load(open('credentials.json',encoding='utf-8'));a=d.get('accounts') or {};print('updated_at:',d.get('updated_at'));print('账号数:',len(a));[print('  -',k,'cookies:',len(v.get('cookies') or {}),'token:','有' if v.get('access_token') else '无') for k,v in a.items()]"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "工作区里没有 credentials.json（本次没拿到新凭证，且缓存里也没有）"
          fi

      - name: 'Update credential secret'
        # 登录拿到的 Cookie / Token 在下一次运行时可以复用，省掉一次浏览器登录
        if: always() && steps.creds.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.JLC_SECRET_PAT }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=凭证未回写::未配置 JLC_SECRET_PAT，JLC_CREDENTIALS 不会更新；凭证只留在 Actions 缓存里（缓存可能被淘汰，建议配 PAT）"
            exit 0
          fi
          if gh secret set JLC_CREDENTIALS --repo "$GITHUB_REPOSITORY" < credentials.json; then
            echo "::notice title=凭证已回写::JLC_CREDENTIALS 已更新，下次运行可直接复用"
            gh secret list --repo "$GITHUB_REPOSITORY" | grep -i JLC_CREDENTIALS || true
          else
            echo "::error title=凭证回写失败::检查 JLC_SECRET_PAT 是否过期、是否对本仓库有 Secrets 写权限（经典 PAT 需 repo，fine-grained 需 Secrets: Read and write）"
          fi

      - name: 'Save credential cache'
        if: always() && steps.creds.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: credentials.json
          key: jlc-credentials-${{ github.run_id }}-${{ github.run_attempt }}
