name: auto-signin

on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'
    - cron: '17 10 * * *'
    #在这里设置UTC运行时间，如果不知道怎么配置可以问AI
    #实际运行时间会比设置时间延迟一小时以内，取决于当时github资源占用情况。

jobs:
  running:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: 3.7

      - name: 'Set Timezone to UTC+8'
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "Current time: $(date)"

      - name: 'Install requirements'
        run: |
          pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: Prepare chromedriver
        uses: nanasess/setup-chromedriver@v2

      - name: 'Masking self-check'
        # 这行不含任何 secret。如果它在网页日志里变成 ***，说明是 GitHub 在按 secret
        # 遮罩日志里的数字片段（通常是某个值很短的 secret 误伤），跟脚本无关
        run: |
          echo "mask-probe: 3.7.17 22:16:57 1/4 188****045"

      - name: 'Working'
        env:
          # 账号密码走环境变量而不是命令行参数：secret 出现在命令行会被日志整段打码成 ***，
          # 连无关的数字也可能被一起遮掉，排错时完全看不出跑到第几个账号
          JLC_USERNAME: ${{ secrets.JLC_USERNAME }}
          JLC_PASSWORD: ${{ secrets.JLC_PASSWORD }}
          # 上次运行留下的凭证（JSON）。为空时本次会走浏览器登录
          JLC_CREDENTIALS: ${{ secrets.JLC_CREDENTIALS }}
          # Server酱3 推送（可选）：不配置该 secret 则跳过推送
          SERVERCHAN3_SCKEY: ${{ secrets.SERVERCHAN3_SCKEY }}
          JLC_CREDENTIAL_FILE: credentials.json
          # 任意账号签到失败 → 这一步失败，Actions 会标红并发送失败通知邮件
          JLC_FAIL_EXIT: 'true'
        run: |
          python ./jlc.py

      - name: 'Update credential secret'
        # 登录拿到的 Cookie / Token 回写到 JLC_CREDENTIALS，下次运行可跳过浏览器
        if: always()
        env:
          GH_TOKEN: ${{ secrets.JLC_SECRET_PAT }}
        run: |
          if [ ! -s credentials.json ]; then
            echo "本次没有产生新凭证，跳过回写"
            exit 0
          fi
          echo "凭证文件: $(wc -c < credentials.json) 字节"
          python -c "import json;d=json.load(open('credentials.json',encoding='utf-8'));print('updated_at:',d.get('updated_at'),'| 账号数:',len(d.get('accounts') or {}))" \
            || echo "凭证文件解析失败（不影响签到结果）"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=凭证未回写::未配置 JLC_SECRET_PAT，下次运行会重新登录"
            exit 0
          fi
          if gh secret set JLC_CREDENTIALS --repo "$GITHUB_REPOSITORY" < credentials.json; then
            echo "::notice title=凭证已回写::JLC_CREDENTIALS 已更新"
          else
            echo "::error title=凭证回写失败::检查 JLC_SECRET_PAT 是否过期、是否对本仓库有 Secrets 写权限"
          fi
          rm -f credentials.json
