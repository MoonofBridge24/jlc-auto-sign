name: 合并上游同步分支到 main

# 手动触发：把「上游同步」工作流建好的 upstream-sync 分支合并进 main，
# 然后关闭对应的待合并通知 issue，并删除该分支。
# 之所以拆成两步，是为了让 main 上的变更始终经过一次人工确认。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要合并的同步分支名'
        required: true
        default: 'upstream-sync'
      delete_branch:
        description: '合并成功后删除该分支'
        type: boolean
        default: true
      close_issues:
        description: '合并成功后关闭 upstream-sync 标签的待合并通知'
        type: boolean
        default: true

permissions:
  contents: write  # 推送 main、删除分支
  issues: write    # 关闭通知 issue

env:
  ISSUE_LABEL: upstream-sync

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # 需要分支历史才能合并

      - name: 设置 Git 配置
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config core.autocrlf false

      - name: 检查同步分支
        id: check
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin --prune

          if ! git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            echo "::error title=分支不存在::远程没有 ${BRANCH} 分支，先跑一次「上游同步」"
            exit 1
          fi

          AHEAD=$(git rev-list --count "main..origin/${BRANCH}")
          echo "ahead=${AHEAD}" >> "$GITHUB_OUTPUT"

          if [ "$AHEAD" -eq 0 ]; then
            echo "::notice title=无需合并::${BRANCH} 已包含在 main 中，没有需要合并的提交"
            echo "nothing=true" >> "$GITHUB_OUTPUT"
          else
            echo "${BRANCH} 领先 main ${AHEAD} 个提交"
            echo "nothing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 合并到 main
        id: merge
        if: steps.check.outputs.nothing == 'false'
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          if ! git merge --no-ff --no-edit "origin/${BRANCH}" \
               -m "chore: 合并上游同步分支 ${BRANCH}"; then
            git merge --abort || true
            echo "::error title=合并冲突::${BRANCH} 与 main 有冲突，请在本地解决后手动推送"
            exit 1
          fi

          git push origin HEAD:main
          SHA=$(git rev-parse --short HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "✅ 已合并到 main（${SHA}）"

      - name: 关闭待合并通知
        if: steps.check.outputs.nothing == 'false' && inputs.close_issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail

          NUMBERS=$(gh issue list --label "$ISSUE_LABEL" --state open --limit 20 \
            --json number --jq '.[].number')
          if [ -z "${NUMBERS:-}" ]; then
            echo "没有待关闭的通知 issue"
            exit 0
          fi

          for n in $NUMBERS; do
            gh issue comment "$n" --body "已合并分支 \`${BRANCH}\` 到 main（${SHA}），自动关闭。" >/dev/null
            gh issue close "$n" --reason completed >/dev/null
            echo "🔕 已关闭通知 #$n"
          done

      - name: 删除同步分支
        if: steps.check.outputs.nothing == 'false' && inputs.delete_branch
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if git push origin --delete "$BRANCH" 2>/dev/null; then
            echo "🧹 已删除分支 $BRANCH"
          else
            echo "::warning title=删除分支失败::分支 $BRANCH 可能已被删除或受保护"
          fi

      - name: Workflow 总结
        if: always()
        run: |
          {
            echo "### 上游同步合并结果"
            echo
            echo "- 分支：\`${{ inputs.branch }}\`"
            echo "- 领先 main：${{ steps.check.outputs.ahead || 0 }} 个提交"
            echo "- 合并结果：${{ steps.merge.outputs.sha && '已合并 ' }}${{ steps.merge.outputs.sha || '未合并（无变更或失败）' }}"
          } >> "$GITHUB_STEP_SUMMARY"
