name: 合并上游同步分支到 main

# 手动触发：把「上游同步」工作流建好的 upstream-sync 分支合并进 main，
# 然后处理对应的待合并 PR（正常会因合并自动变为 Merged）并删除该分支。
# 之所以拆成两步，是为了让 main 上的变更始终经过一次人工确认。
#
# 提示：也可以直接在上游同步 PR 的网页上点 Merge pull request，
# 效果一样（只是不会顺手删除分支、也不会清理残留的 PR）。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要合并的同步分支名'
        required: true
        default: 'upstream-sync'
      delete_branch:
        description: '合并成功后删除该分支'
        type: boolean
        default: true
      close_prs:
        description: '合并后关闭仍处于 open 状态的 upstream-sync PR'
        type: boolean
        default: true

permissions:
  contents: write       # 推送 main、删除分支
  pull-requests: write  # 合并 / 评论 / 关闭 PR

env:
  BASE_BRANCH: main
  PR_LABEL: upstream-sync

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # 需要分支历史才能合并

      - name: 设置 Git 配置
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config core.autocrlf false

      - name: 检查同步分支
        id: check
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin --prune

          if ! git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            echo "::error title=分支不存在::远程没有 ${BRANCH} 分支，先跑一次「上游同步」"
            exit 1
          fi

          AHEAD=$(git rev-list --count "${BASE_BRANCH}..origin/${BRANCH}")
          echo "ahead=${AHEAD}" >> "$GITHUB_OUTPUT"

          if [ "$AHEAD" -eq 0 ]; then
            echo "::notice title=无需合并::${BRANCH} 已包含在 ${BASE_BRANCH} 中，没有需要合并的提交"
            echo "nothing=true" >> "$GITHUB_OUTPUT"
          else
            echo "${BRANCH} 领先 ${BASE_BRANCH} ${AHEAD} 个提交"
            echo "nothing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 找到对应的 PR
        id: pr
        if: steps.check.outputs.nothing == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          NUM=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "${NUM:-}" ]; then
            echo "找到待合并 PR #$NUM"
          else
            echo "没有 open PR，直接走 git merge"
          fi
          echo "number=${NUM:-}" >> "$GITHUB_OUTPUT"

      - name: 合并到 main
        id: merge
        if: steps.check.outputs.nothing == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch }}
          PR_NUM: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          # 有 PR 时优先走 API 合并，这样 PR 会明确标记为 Merged
          if [ -n "${PR_NUM:-}" ]; then
            if gh pr merge "$PR_NUM" --merge --delete-branch=false >/dev/null 2>&1; then
              SHA=$(gh pr view "$PR_NUM" --json mergeCommit --jq '.mergeCommit.oid // empty')
              SHA=${SHA:0:7}
              echo "✅ 已通过 PR #$PR_NUM 合并到 ${BASE_BRANCH}（${SHA}）"
              echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
              echo "via=pr" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning title=PR 合并失败::PR #$PR_NUM 无法通过 API 合并（可能受分支保护限制），改用 git merge"
          fi

          if ! git merge --no-ff --no-edit "origin/${BRANCH}" \
               -m "chore: 合并上游同步分支 ${BRANCH}"; then
            git merge --abort || true
            echo "::error title=合并冲突::${BRANCH} 与 ${BASE_BRANCH} 有冲突，请在本地解决后手动推送"
            exit 1
          fi

          git push origin "HEAD:${BASE_BRANCH}"
          SHA=$(git rev-parse --short HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "via=git" >> "$GITHUB_OUTPUT"
          echo "✅ 已通过 git merge 合并到 ${BASE_BRANCH}（${SHA}）"

      - name: 清理 PR
        if: steps.check.outputs.nothing == 'false' && inputs.close_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail

          # 走 API 合并的 PR 已是 MERGED；走 git merge 的通常会被 GitHub 自动识别为已合并，
          # 这里兜底：仍然 open 的（例如 PR 与 main 有冲突导致未被识别）就评论并关闭。
          NUMS=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --limit 20 \
            --json number --jq '.[].number')
          if [ -z "${NUMS:-}" ]; then
            echo "没有仍处于 open 状态的同步 PR，无需清理"
            exit 0
          fi

          for n in $NUMS; do
            gh pr comment "$n" --body "已合并分支 \`${BRANCH}\` 到 ${BASE_BRANCH}（${SHA}），自动关闭。" >/dev/null
            gh pr close "$n" >/dev/null
            echo "🔕 已关闭 PR #$n"
          done

      - name: 删除同步分支
        if: steps.check.outputs.nothing == 'false' && inputs.delete_branch
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if git push origin --delete "$BRANCH" 2>/dev/null; then
            echo "🧹 已删除分支 $BRANCH"
          else
            echo "::warning title=删除分支失败::分支 $BRANCH 可能已被删除或受保护"
          fi

      - name: Workflow 总结
        if: always()
        run: |
          {
            echo "### 上游同步合并结果"
            echo
            echo "- 分支：\`${{ inputs.branch }}\`"
            echo "- 领先 ${BASE_BRANCH}：${{ steps.check.outputs.ahead || 0 }} 个提交"
            echo "- 合并方式：${{ steps.merge.outputs.via || '未合并' }}"
            echo "- 合并结果：${{ steps.merge.outputs.sha && '已合并 ' }}${{ steps.merge.outputs.sha || '未合并（无变更或失败）' }}"
          } >> "$GITHUB_STEP_SUMMARY"
