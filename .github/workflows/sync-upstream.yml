name: 上游同步（只建分支 + 开 PR，不直接合并）

# 这个脚本做三件事：
#   1. 检查上游仓库（UPSTREAM_REPO）是否有新提交；
#   2. 有更新时把提交应用到独立分支 upstream-sync 并推送，**不碰 main**；
#   3. 对 main 开一个 Pull Request 通知仓库管理者，等人工确认后合并。
# 另外仍然保留 heartbeat 保活（防止 actions 因仓库不活跃被自动禁用），心跳只在 heartbeat 分支。

on:
  schedule:
    - cron: '0 16 */14 * *'  # 每14天北京时间 0 点触发一次（UTC+8）
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write       # 推送同步分支 / heartbeat 分支
  pull-requests: write  # 创建和更新同步 PR

env:
  UPSTREAM_REPO: zhangMonday/PCBfactory-auto-check-in
  SYNC_BRANCH: upstream-sync
  BASE_BRANCH: main
  PR_LABEL: upstream-sync

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，便于逐个应用上游提交

      - name: 设置 Git 配置
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config core.autocrlf false

      - name: 添加上游仓库
        run: |
          if ! git remote | grep -q '^upstream$'; then
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi

      - name: 切换到 main 分支
        run: git checkout main

      - name: 获取上游更新
        run: git fetch upstream

      - name: 检查是否有更新
        id: check-update
        run: |
          if ! git show-ref --verify --quiet refs/remotes/upstream/main; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "commit_count=0" >> "$GITHUB_OUTPUT"
            echo "::warning::上游 main 分支不存在，跳过同步"
            exit 0
          fi

          COUNT=$(git rev-list --count main..upstream/main 2>/dev/null || echo 0)
          echo "commit_count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ] && ! git diff --quiet main..upstream/main 2>/dev/null; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "检测到上游 $COUNT 个新提交"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "上游没有新的有效变更"
          fi

      - name: 在独立分支上应用上游更新
        id: prepare
        if: steps.check-update.outputs.has_update == 'true'
        run: |
          set -euo pipefail
          export GITHUB_OUTPUT="${GITHUB_OUTPUT:-/dev/null}"
          export GITHUB_ENV="${GITHUB_ENV:-/dev/null}"

          REPORT="${RUNNER_TEMP:-/tmp}/sync-report.md"
          rm -f "$REPORT"

          git checkout -B "$SYNC_BRANCH" main

          applied=0; ignored=0; conflicted=0
          applied_text=""; conflicted_text=""
          PATCH=$(mktemp)

          for commit in $(git rev-list --reverse main..upstream/main); do
            msg=$(git log -1 --format=%s "$commit")
            case "$msg" in
              *保持仓库活跃*|*空修改，用于保持仓库活跃*)
                ignored=$((ignored + 1))
                continue
                ;;
            esac

            # 只取「除 .github/workflows 之外」的改动：GITHUB_TOKEN 无权推送 workflow 变更，
            # 而且本仓库的 workflow 是定制的，不应该被上游覆盖。
            # 用 apply 而不是 cherry-pick，是因为上游经常「代码 + workflow」混在一个提交里，
            # cherry-pick 会因 workflow 冲突把整条提交（包括代码）一起丢掉。
            base=$(git rev-parse -q --verify "${commit}^" || true)
            if [ -n "$base" ]; then
              git diff "$base" "$commit" -- . ':(exclude).github/workflows' > "$PATCH" || true
            else
              git show --format= --no-color "$commit" -- . ':(exclude).github/workflows' > "$PATCH" || true
            fi

            if [ ! -s "$PATCH" ]; then
              ignored=$((ignored + 1))
              continue
            fi

            if git apply --index --3way "$PATCH" 2>/dev/null; then
              if git diff --quiet --cached; then
                git reset -q --hard
                ignored=$((ignored + 1))
              else
                git commit -q -m "$msg [${commit:0:7}]"
                applied=$((applied + 1))
                applied_text="${applied_text}${commit:0:7} ${msg}"$'\n'
              fi
            else
              git reset -q --hard
              conflicted=$((conflicted + 1))
              conflicted_text="${conflicted_text}${commit:0:7} ${msg}"$'\n'
              echo "::warning::${commit:0:7} 与本地改动冲突，已跳过"
            fi
          done
          rm -f "$PATCH"

          # 兜底：万一还有 workflow 差异（例如上游新增文件），一律以 main 为准
          if ! git diff --quiet main -- .github/workflows; then
            git checkout main -- .github/workflows 2>/dev/null || true
            git diff --name-only --diff-filter=A main -- .github/workflows \
              | while read -r path; do [ -n "$path" ] && git rm -q -f "$path" || true; done
            git add -A .github/workflows
            git commit -q -m "chore: 不同步上游 workflow 变更（需人工确认）" || true
          fi

          if git diff --quiet main..HEAD; then
            echo "🟡 上游提交没有产生实际变更（可能全是空提交），不建分支也不开 PR"
            git checkout -q main
            git branch -D "$SYNC_BRANCH" >/dev/null 2>&1 || true
            echo "has_branch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AHEAD=$(git rev-list --count main..HEAD)
          git push -f origin "$SYNC_BRANCH"
          echo "✅ 已推送分支 $SYNC_BRANCH（$AHEAD 个提交，未合并到 main）"

          echo "has_branch=true" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"

          # PR 正文写到 RUNNER_TEMP，避免被后面的 heartbeat 步骤清理掉
          {
            echo "上游仓库 \`${UPSTREAM_REPO}\` 有新提交，已同步到分支 \`${SYNC_BRANCH}\`，**尚未合并到 main**。"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 待合并提交 | ${AHEAD} 个 |"
            echo "| 已应用 | ${applied} 个 |"
            echo "| 跳过（空提交/无代码变更） | ${ignored} 个 |"
            echo "| 跳过（与本地冲突） | ${conflicted} 个 |"
            echo "| workflow 文件 | 不同步（保留本仓库版本） |"
            echo
            echo "### 已应用到分支的提交"
            echo
            echo '```'
            printf '%s' "$applied_text" | sed '/^$/d'
            echo '```'
            echo
            if [ "$conflicted" -gt 0 ]; then
              echo "### 冲突跳过的提交（需人工 cherry-pick）"
              echo
              echo '```'
              printf '%s' "$conflicted_text" | sed '/^$/d'
              echo '```'
              echo
            fi
            echo "### 变更文件"
            echo
            echo '```'
            git diff --name-status main..HEAD | head -50
            echo '```'
            echo
            echo "**确认无误后，直接在这个 PR 上点 \`Merge pull request\` 即可合并到 main。**"
            echo
            echo "也可以运行 **Actions → 合并上游同步分支到 main → Run workflow**："
            echo "它会合并分支、关闭这个 PR 并删除分支，适合想顺手清理的场景。"
          } > "$REPORT"
          echo "REPORT=$REPORT" >> "$GITHUB_ENV"

      - name: 开 PR 通知仓库管理者
        if: steps.prepare.outputs.has_branch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AHEAD: ${{ steps.prepare.outputs.ahead }}
        run: |
          set -euo pipefail
          TITLE="上游同步待合并（${SYNC_BRANCH}，$(date -u '+%Y-%m-%d')）"

          gh label create "$PR_LABEL" --color FBCA04 \
            --description "上游同步分支待合并" --force >/dev/null 2>&1 || true

          # 同一个 head 分支只允许存在一个 open PR，已存在就更新正文
          EXISTING=$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --limit 1 \
            --json number --jq '.[0].number // empty')

          if [ -n "${EXISTING:-}" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$REPORT" >/dev/null
            gh pr comment "$EXISTING" --body "🔄 分支已更新（新增 ${AHEAD} 个待合并提交，$(date -u '+%Y-%m-%d %H:%M UTC')），正文已刷新。" >/dev/null
            echo "::notice title=上游同步::PR #$EXISTING 已更新，等待人工合并"
          else
            # force push 之后 GitHub 偶尔会短暂认为「没有差异」，这里重试几次
            URL=""
            for attempt in 1 2 3; do
              if URL=$(gh pr create --base "$BASE_BRANCH" --head "$SYNC_BRANCH" \
                   --title "$TITLE" --body-file "$REPORT" --label "$PR_LABEL" 2>&1); then
                break
              fi
              echo "第 ${attempt} 次创建 PR 失败：$URL"
              URL=""
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
            done

            if [ -z "$URL" ]; then
              echo "::error title=创建 PR 失败::连续 3 次都没能创建 PR"
              echo "如果提示 'GitHub Actions is not permitted to create or approve pull requests'，"
              echo "请到仓库 Settings → Actions → General → Workflow permissions 勾选"
              echo "'Allow GitHub Actions to create and approve pull requests' 后重跑。"
              echo "分支 ${SYNC_BRANCH} 已推送成功，也可以手动在网页上对 main 开 PR。"
              exit 1
            fi
            echo "$URL" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=上游同步::$URL 已创建，等待人工合并"
          fi

      - name: 心跳提交（heartbeat 分支）
        run: |
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/heartbeat; then
            echo "🟢 heartbeat 分支已存在，切过去更新心跳文件"
            git checkout -B heartbeat origin/heartbeat
          else
            echo "🆕 heartbeat 分支不存在，创建独立分支"
            git checkout --orphan heartbeat
          fi

          # 分支上只保留 heartbeat.txt 一个文件，其余全部清掉（兼容历史上基于 main 创建的情况）
          git rm -rf . -q || true

          date -u '+%Y-%m-%d %H:%M:%S UTC' > heartbeat.txt
          git add heartbeat.txt
          git commit -m "心跳：$(date -u '+%Y-%m-%d')"
          git push origin heartbeat || echo "⚠️ heartbeat 推送失败，请检查权限设置"
          echo "✅ 心跳文件已更新（分支上仅 heartbeat.txt），main 保持干净"

      - name: Workflow 总结
        run: |
          {
            echo "### 上游同步结果"
            echo
            echo "- 上游新提交：${{ steps.check-update.outputs.commit_count || 0 }} 个"
            echo "- 是否建了同步分支：${{ steps.prepare.outputs.has_branch || 'false' }}"
            echo "- 同步分支：\`${SYNC_BRANCH}\`（main 未被修改）"
            echo "- 待合并提交：${{ steps.prepare.outputs.ahead || 0 }} 个"
          } >> "$GITHUB_STEP_SUMMARY"
